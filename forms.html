<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>forms</title>
  </head>
  <body>
    <fieldset>
      <form action="#">
        <label for="name">UserName:</label>
        <input
          type="text"
          name="name"
          id="name"
          placeholder="enter your name"
          required
        />
        <br /><br />
        <label for="password">Password:</label>
        <input
          type="password"
          name="pass"
          id="pass"
          placeholder="enter your password"
        />
        <br /><br />
        <label for="email">Email</label>
        <input
          type="email"
          name="email"
          id="email"
          placeholder="enter your email"
        />
        <br /><br />
        <label for="gender">Gender:</label>
        <input type="radio" name="gender" id="gemder" />
        <label for="gender">male</label>
        <input type="radio" name="gender" id="gemder" />
        <label for="gender">female</label>
        <br /><br />
        <label for="hobb">Hobbies</label>
        <input type="checkbox" name="hobb1" id="hobb1" />
        <label for="hobb1">cricket</label>
        <input type="checkbox" name="hobb2" id="hobb2" />
        <label for="hobb2">football</label>
        <br /><br />
        <label for="dob">DOB:</label>
        <input type="date" name="dob" id="dob" />
<br><br>
<label for="lang">select programming language</label>
<select name="lang" id="lang">
    <option value="">select language</option>
<option value="C">C</option>
<option value="c++">c++</option>
<option value="python">python</option>
<option value="java">java</option>
</select>






      </form>
    </fieldset>
  </body>
</html>
